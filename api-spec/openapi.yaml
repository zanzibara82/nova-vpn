openapi: "3.1.0"
info:
  title: NovaVPN control plane — API цикла A
  version: "1.1.0"
  description: >
    Контракт цикла A: идентификация, сессии, устройства, каталог серверов, профили,
    операционный API администратора и внутренний контракт vpn-узла (/internal/v1).
    Маршруты /api/v1 — публичный API; /internal/v1 — внутренний контракт узла, доступ к
    нему имеет только узел с узловым токеном, и частью публичного API он не является.
    Числовые поля каталога, которых контрол-плейн не измерял (задержка, загрузка,
    доступность), передаются как null, а не как ноль: спецификация §13.4 и ADR-006
    запрещают подставлять вместо замера правдоподобное число.
  license:
    # SPDX-конвенция для закрытых лицензий; публичной лицензии у продукта нет.
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.novavpn.local
tags:
  - name: auth
    description: Идентификация и сессии — регистрация, вход, refresh, logout, /me.
  - name: devices
    description: Устройства пользователя — регистрация, список, отзыв и ротация ключа.
  - name: servers
    description: >
      Каталог серверов для подписчика. Availability измеряется только по свежему
      heartbeat узла; задержка и загрузка не измерялись и приходят как null.
  - name: profiles
    description: Профили подключения — выдача, список, отзыв и текст WireGuard-конфига.
  - name: node
    description: >
      Внутренний контракт vpn-узла (/internal/v1). Это не публичный API: доступ имеет
      только узел с узловым токеном, выданным enroll, и токен сверяется с id в пути.
  - name: admin
    description: >
      Операционный API (§7.6, §9): серверы, bootstrap-токены, блокировка пользователей и
      журнал административных действий. Требует токен администратора, а не участника.
paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация аккаунта с выдачей сессии.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Аккаунт создан, сессия выдана.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: Email уже зарегистрирован.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [email_taken] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по email и паролю.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Сессия выдана.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: Неверный email или пароль — один ответ на оба случая.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [invalid_credentials] }
        "403":
          description: Учётная запись заблокирована администратором.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [account_locked] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Обмен refresh-токена на новую пару.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Новая пара токенов; предъявленный refresh перестал быть действующим.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: >
            Refresh не принят: токен не разобран, семья не найдена, семья отозвана или
            секрет переиспользован. Различия в журнале, наружу — один код, чтобы по
            ответу нельзя было определить, какой семьи существуют.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [refresh_token_invalid] }
        # 403 здесь обязателен: Rotate читает статус пользователя (задача 17, шаг 4), и
        # заблокированный аккаунт не продлевает доступ. Без этой строки живой ответ 403
        # не был бы описан контрактом, а контракт-first на этом маршруте теряет смысл.
        "403":
          description: Учётная запись заблокирована — новая пара не выдаётся.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [account_locked] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Отзыв семьи refresh-токенов.
      security: []
      description: >
        Отзыв семьи refresh. Аутентификации по access-токену не требует: отзыв обязан
        сработать и когда access уже просрочен. Действующее доказательство владения
        сессией — сам refresh-токен в теле.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Семья отозвана. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: >
            Refresh не разобран (не формат семьи). Уже отозванная или несуществующая
            семья отвечает 204: отзыв идемпотентен, а различение этих случаев —
            оракул «какие семьи существовали».
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [refresh_token_invalid] }
        # 429 есть у всех четырёх публичных маршрутов, включая logout: он тоже
        # монтируется под dec.Anonymous (задача 18), и «отзыв на скорость» лимитируется
        # наравне с перебором семей.
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Аккаунт, план и использование устройств.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Пользователь, план и использование устройств.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        # 429 — окно на пользователя (dec.Auth в задаче 18): закрытые маршруты тоже
        # лимитируются, и контракт обязан это показывать.
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/devices:
    post:
      tags: [devices]
      operationId: createDevice
      summary: Регистрация устройства (идемпотентно).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCreate" }
      responses:
        "201":
          description: Устройство зарегистрировано.
          headers:
            Idempotency-Replayed:
              description: Присутствует при повторе того же ключа.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Активной подписки нет — прав на устройства не кому дать.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [forbidden] }
        "409":
          description: >
            Лимит устройств по тарифу, дубликат публичного ключа либо конфликт
            Idempotency-Key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - device_limit_reached
                              - duplicate_device
                              - idempotency_key_conflict
                              - idempotency_key_in_progress
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      tags: [devices]
      operationId: listDevices
      summary: Список устройств пользователя.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Все устройства пользователя, включая отозванные.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        # 429 — окно на пользователя (dec.Auth в задаче 18): закрытые маршруты тоже
        # лимитируются, и контракт обязан это показывать.
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/servers:
    get:
      tags: [servers]
      operationId: listServers
      summary: Каталог серверов с честной доступностью.
      description: >
        Список выведенных в раздачу серверов. availability = available только при
        свежем (не старше 90 с) heartbeat со статусом ok; во всех прочих случаях —
        unknown, а не выдуманное «недоступен». latency_ms и load всегда null: контрол-
        плейн их не измерял, и ноль здесь читался бы как измеренный ноль.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Серверы и их состояние. Пустой каталог — `{"servers":[]}`, а не 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Отзыв устройства.
      description: >
        Отзывает устройство и все его активные профили. Повторный DELETE и чужое
        устройство отвечают одинаково 404: по различию ответов перебирали бы, у каких
        устройств доступ уже закрыт.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Устройство отозвано. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/devices/{id}/keys/rotate:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      tags: [devices]
      operationId: rotateDeviceKey
      summary: Ротация ключа устройства с overlap-окном.
      description: >
        Создаёт устройство-потомок с новым ключом (платформа и имя наследуются), а
        профили предка переводятся в superseded с overlap_valid_until: старый ключ
        продолжает работать до закрытия окна. Ответ — 200 с устройством-потомком, а не
        201: в терминах пользователя это новое состояние того же устройства.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateRequest" }
      responses:
        "200":
          description: Устройство-потомок создано, профили предка в overlap-окне.
          headers:
            Idempotency-Replayed:
              description: Присутствует при повторе того же ключа.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Дубликат ключа, отозванный предок (reason device_revoked), профиль предка
            изменился параллельно (reason profile_changed) либо конфликт Idempotency-Key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - conflict
                              - duplicate_device
                              - idempotency_key_conflict
                              - idempotency_key_in_progress
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/devices/{id}/profiles:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      tags: [profiles]
      operationId: issueProfile
      summary: Выдача профиля на сервер (идемпотентно).
      description: >
        §7.1: отказ «сервера нет в вашем плане», «сервер не online» и «устройство
        отозвано» приходит стабильным кодом (404/409/403), а не 503: 503 обещал бы
        клиенту «повтори позже», которого администратор не выполнял.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileIssueRequest" }
      responses:
        "201":
          description: Профиль выдан.
          headers:
            Idempotency-Replayed:
              description: Присутствует при повторе того же ключа.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileView" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Устройство отозвано либо активной подписки нет.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [forbidden] }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Профиль уже активен, пул адресов исчерпан (reason pool_exhausted), гонка
            аллокации (reason address_race), сервер не online (server_not_available)
            либо конфликт Idempotency-Key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - conflict
                              - server_not_available
                              - idempotency_key_conflict
                              - idempotency_key_in_progress
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: Профили устройства.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Профили устройства. Пустой список — `{"profiles":[]}`, а не 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/devices/{id}/profiles/{server_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Профиль устройства на сервере.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Профиль.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileView" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [profiles]
      operationId: revokeProfile
      summary: Отзыв профиля.
      description: >
        204 без тела. Повторный отзыв — 409 conflict с настоящим статусом профиля в
        details.status: молчаливый успех скрыл бы, что доступ уже не тот, который
        человек думал отозвать.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Профиль отозван. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Профиль уже не активен; details.status — настоящее состояние из базы.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/devices/{id}/profiles/{server_id}/config:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [profiles]
      operationId: getProfileConfig
      summary: Текст WireGuard-конфига для профиля.
      description: >
        Текст в формате WireGuard ([Interface]/[Peer]) без строки PrivateKey:
        приватный ключ устройства не покидает устройство (ТЗ §5), клиент вставляет его
        локально перед применением. Ответ не кэшируется (Cache-Control: no-store):
        конфиг — доступ, который отзывают, и ответ из кэша после отзыва означал бы
        рабочий доступ.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Текст конфига; PrivateKey в нём отсутствует по построению.
          headers:
            Cache-Control:
              description: Всегда no-store — конфиг не подлежит кэшированию.
              schema: { type: string, enum: ["no-store"] }
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Профиль уже не активен; details.status — настоящее состояние из базы.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Вход администратора.
      description: >
        Тот же конверт отказа и та же прогрессивная задержка, что у входа участника;
        отличается таблица (admin_users) и iss токена (novavpn-admin). Refresh-пары у
        администратора нет: срок токена равен AccessTTL.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Токен администратора выдан.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: Неверный email или пароль — один ответ на оба случая.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [invalid_credentials] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/servers:
    get:
      tags: [admin]
      operationId: adminListServers
      summary: Все серверы, включая не выведенные в раздачу.
      security: [{ adminBearerAuth: [] }]
      responses:
        "200":
          description: Серверы и число активных профилей на каждом.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminServerList" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [admin]
      operationId: adminCreateServer
      summary: Заведение сервера.
      description: >
        Создаёт локацию, если её ещё нет (уникальность держит база), и сервер в статусе
        maintenance: «зарегистрирован» ≠ «работает». Адресный пул — маска от /24 до /29 и
        адрес сети, а не хоста внутри неё. Создание записывается в аудит в той же
        транзакции.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminServerCreate" }
      responses:
        "201":
          description: Сервер создан.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminServerView" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "409":
          description: Сервер с таким именем или публичным ключом уже есть.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/servers/{id}:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    get:
      tags: [admin]
      operationId: adminGetServer
      summary: Сервер и его здоровье.
      description: >
        health = null означает «узел ещё не присылал замер», а не нули: §13.4 запрещает
        превращать отсутствие замера в «ноль пиеров».
      security: [{ adminBearerAuth: [] }]
      responses:
        "200":
          description: Сервер; health может быть null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminServerDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [admin]
      operationId: adminPatchServer
      summary: Правка полей сервера.
      description: >
        MTU и keepalive живут в [Peer] каждого клиента, поэтому правка поднимает
        config_version: без bump'а узел оставил бы прежний набор при уже изменённых
        полях сервера.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminServerPatch" }
      responses:
        "200":
          description: Сервер после правки.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminServerView" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Сервер с таким именем уже есть.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [admin]
      operationId: adminDeleteServer
      summary: Удаление сервера.
      description: >
        §7.6: удаление возможно только при нуле активных профилей. Отказ называет число
        в details.peers_active до любого изменения. Причина необязательна в теле, но
        обязательна по смыслу: без неё — 400 по полю reason.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Сервер удалён. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: На сервере остались активные профили; details.peers_active — их число.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/servers/{id}/maintenance:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    post:
      tags: [admin]
      operationId: adminSetMaintenance
      summary: Перевод сервера в служебный статус.
      description: >
        retired — конец, а не пауза: обратный переход в online запрещён (409). Вытеснение
        (draining) и вывод (retired) пишутся в аудит отдельным действием, чтобы по
        журналу было видно вытеснение, а не правку поля.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceRequest" }
      responses:
        "200":
          description: Новый статус и поднятая версия конфигурации.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceView" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Выведенный из эксплуатации сервер нельзя вернуть в online.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/servers/{id}/bootstrap-tokens:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    post:
      tags: [admin]
      operationId: adminIssueBootstrapToken
      summary: Выдача одноразового стартового токена узла.
      description: >
        Секрет показывается ровно один раз, в этом ответе: в базе лежит sha256, и
        восстановить значение нечем. TTL по умолчанию 3600 с, допустимое окно
        60..86400. Ответ не кэшируется (Cache-Control: no-store).
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapTokenRequest" }
      responses:
        "201":
          description: Токен выдан; поле token присутствует только в этом ответе.
          headers:
            Cache-Control:
              description: Всегда no-store — ответ содержит секрет.
              schema: { type: string, enum: ["no-store"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapTokenIssued" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Сервер выведен из эксплуатации — токен потратить некому.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      tags: [admin]
      operationId: adminListBootstrapTokens
      summary: Живые стартовые токены сервера.
      description: >
        Ни секрета, ни хэша в списке нет по построению: хэш сделал бы список словарём
        для подбора значения.
      security: [{ adminBearerAuth: [] }]
      responses:
        "200":
          description: Живые токены сервера.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapTokenList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/bootstrap-tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    delete:
      tags: [admin]
      operationId: adminRevokeBootstrapToken
      summary: Отзыв стартового токена.
      description: >
        Ноль обновлённых строк — не успех: «токена нет» и «токен уже сожжён узлом»
        требуют разных продолжений, поэтому оба дают 409, а не 204.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Токен отозван. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "409":
          description: Токен уже использован, отозван или не найден.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/servers/{id}/node-token/revoke:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    post:
      tags: [admin]
      operationId: adminRevokeNodeToken
      summary: Отрезать узел.
      description: >
        Гасит все узловые токены сервера, поднимает config_version и переводит сервер в
        draining. Ноль отозванных токенов — не ошибка: «отрежь узел, который ещё не
        приходил» — штатный шаг раскатки.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Узел отрезан. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: Аккаунт, устройства и трафик за 30 дней.
      description: >
        password_hash отсутствует и в выборке, и в схеме ответа. traffic — окно
        TrafficWindowDays (30 суток), а не «весь срок»: device_day_traffic без границы
        растёт быстрее, чем экран админа.
      security: [{ adminBearerAuth: [] }]
      responses:
        "200":
          description: Просмотр аккаунта.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserView" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/users/{id}/lock:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    post:
      tags: [admin]
      operationId: adminLockUser
      summary: Блокировка аккаунта.
      description: >
        Снимает доступ целиком: статус пользователя, refresh-семьи, все живые профили и
        занятые адреса, плюс bump config_version на затронутых серверах. Текущий access
        доживает AccessTTL — это замеренное ограничение A-1, а не скрытая дыра.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockRequest" }
      responses:
        "200":
          description: Аккаунт заблокирован; число отозванных профилей и серверов.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Учётная запись уже заблокирована.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/users/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/UUIDPath"
    post:
      tags: [admin]
      operationId: adminUnlockUser
      summary: Разблокировка аккаунта.
      description: >
        Возвращает право войти, но не выданные конфиги: профили остаются отозванными,
        иначе аудит «был отозван» расходился бы с реальным набором пиеров.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockRequest" }
      responses:
        "200":
          description: Аккаунт разблокирован.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Учётная запись не заблокирована.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/admins:
    post:
      tags: [admin]
      operationId: adminCreateAdmin
      summary: Заведение администратора.
      description: >
        email_taken занят контрактом A-1 за регистрацией участников, поэтому дубликат
        админского email отвечает 409 conflict, а не вторым смыслом того же кода.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreate" }
      responses:
        "201":
          description: Администратор создан.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminView" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "409":
          description: Администратор с таким email уже есть.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminListAudit
      summary: Журнал административных действий.
      description: >
        Фильтра по админу и действию нет: §5.1 обещает «аудит», а не «поиск по
        аудитам». limit 1..500 (по умолчанию 50), offset 0..10000.
      security: [{ adminBearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Записи журнала, новее — первыми.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /internal/v1/nodes/enroll:
    post:
      tags: [node]
      operationId: nodeEnroll
      summary: Регистрация узла по стартовому токену.
      description: >
        Единственный маршрут узла без узлового токена: у ещё не зарегистрированного узла
        токена нет физически. Расход стартового токена, отзыв прежнего узлового токена и
        вставка нового идут одной транзакцией. Ответ не кэшируется (Cache-Control:
        no-store) — в теле секрет.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeEnrollRequest" }
      responses:
        "200":
          description: Узел зарегистрирован, выдан узловой токен.
          headers:
            Cache-Control:
              description: Всегда no-store — ответ содержит секрет.
              schema: { type: string, enum: ["no-store"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeToken" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: >
            Стартовый токен не принят: неизвестен, просрочен, израсходован, отозван или
            публичный ключ не тот. Различия — только в журнале, наружу один ответ.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [unauthenticated] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /internal/v1/nodes/{server_id}/desired:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      tags: [node]
      operationId: nodeDesired
      summary: Желаемый набор пиеров узла.
      description: >
        ETag — сильный валидатор от содержимого набора, а не от config_version: набор
        меняется и сам (закрытие overlap по времени, снятие старого ключа после
        handshake нового). Сравнение If-None-Match строгое; при совпадении — 304 без
        тела. measured_at из хэша исключён: это время ответа, а не содержимое.
      security: [{ nodeBearerAuth: [] }]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag предыдущего ответа; при совпадении сервер отвечает 304.
          schema: { type: string }
      responses:
        "200":
          description: Набор пиеров и его ETag.
          headers:
            ETag:
              description: Сильный валидатор содержимого набора.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredSet" }
        "304":
          description: >
            Набор не изменился. Ответ без тела — единственный такой случай во всём
            контракте; JSON в нём искать не нужно.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/NodeUnauthenticated" }
        "403":
          description: Узловой токен не принадлежит серверу из пути.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [forbidden] }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /internal/v1/nodes/{server_id}/observed:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [node]
      operationId: nodeObserved
      summary: Отчёт узла о наблюдаемых счётчиках.
      description: >
        server_id в теле нет намеренно: субъект запроса — токен узла, а сервер берётся из
        пути и сверяется с токеном. Второе указание сервера означало бы, что узел может
        сообщить один id, а получить доступ по другому. Счётчики выше 2^50 отвергаются
        как сломанный агент: такая дельта переполняет bigint дневного агрегата.
      security: [{ nodeBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObservedReport" }
      responses:
        "204": { description: Отчёт принят. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/NodeUnauthenticated" }
        "403":
          description: Узловой токен не принадлежит серверу из пути.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [forbidden] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /internal/v1/nodes/{server_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [node]
      operationId: nodeHeartbeat
      summary: Heartbeat узла.
      description: >
        load1 и cpu_pct — nullable: неизмеренное не превращается в ноль (§13.4).
        Свежесть heartbeat решает availability в каталоге: окно 90 с, три интервала
        опроса по 30 с.
      security: [{ nodeBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Heartbeat" }
      responses:
        "204": { description: Heartbeat принят. Тело отсутствует. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/NodeUnauthenticated" }
        "403":
          description: Узловой токен не принадлежит серверу из пути.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [forbidden] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /internal/v1/nodes/{server_id}/token/rotate:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      tags: [node]
      operationId: nodeRotateToken
      summary: Перевыпуск узлового токена.
      description: >
        Сначала вставляется новый токен, потом отзывается старый: обратный порядок
        оставил бы узел без доступа при ошибке вставки. Узел, потерявший ответ, уходит в
        enroll заново. Ответ не кэшируется (Cache-Control: no-store) — в теле секрет.
      security: [{ nodeBearerAuth: [] }]
      responses:
        "200":
          description: Новый узловой токен; предъявленный перестал быть действующим.
          headers:
            Cache-Control:
              description: Всегда no-store — ответ содержит секрет.
              schema: { type: string, enum: ["no-store"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeToken" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/NodeUnauthenticated" }
        "403":
          description: Узловой токен не принадлежит серверу из пути.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties:
                          code: { enum: [forbidden] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен участника; iss = novavpn-api.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Токен администратора; iss = novavpn-admin. Это другой класс доступа, а не
        участник с другим id: у него свой бакет лимитера и право на чужие данные.
    nodeBearerAuth:
      type: http
      scheme: bearer
      description: >
        Узловой токен из enroll/rotate — непрозрачный секрет (32 байта в base64url без
        дополнений), не JWT. В базе хранится только его sha256.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ повторозащищённости (спецификация §5.2). Без него запрос отклоняется.
      schema: { type: string, minLength: 1, maxLength: 200 }
    DeviceID:
      name: id
      in: path
      required: true
      description: Идентификатор устройства.
      schema: { type: string, format: uuid }
    ServerID:
      name: server_id
      in: path
      required: true
      description: Идентификатор сервера.
      schema: { type: string, format: uuid }
    UUIDPath:
      name: id
      in: path
      required: true
      description: Идентификатор объекта в админском API.
      schema: { type: string, format: uuid }
  responses:
    InvalidRequest:
      description: Тело или поле не прошло валидацию.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code: { enum: [invalid_request, idempotency_key_required] }
    Unauthenticated:
      description: Access-токен отсутствует, недействителен или в denylist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code: { enum: [unauthenticated] }
    AdminUnauthenticated:
      description: >
        Токен администратора отсутствует, просрочен или выдан не этой аудитории. Ответ
        тот же 401, что и у участника, чтобы не подсказывать, какой класс токена ждут.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code: { enum: [unauthenticated] }
    NodeUnauthenticated:
      description: Узловой токен отсутствует, неизвестен или отозван.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code: { enum: [unauthenticated] }
    NotFound:
      description: >
        Объект не найден либо принадлежит другому пользователю. Эти случаи не
        различаются: по различию ответов перебирали бы чужие объекты.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code: { enum: [not_found] }
    RateLimited:
      description: Превышен token bucket. Повторять раньше Retry-After нельзя.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code: { enum: [rate_limited] }
    Internal:
      description: Внутренняя ошибка. Детали — только в журнале по request_id.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    properties:
                      code: { enum: [internal] }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          # details отсутствует, когда уточнять нечего; потому его нет в required.
          required: [code, message, request_id]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string, pattern: "^[0-9a-f]{16}$" }
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - account_locked
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - device_limit_reached
        - duplicate_device
        - server_not_available
        - idempotency_key_required
        - idempotency_key_conflict
        - idempotency_key_in_progress
        - rate_limited
        - internal
        - invalid_credentials
        - refresh_token_invalid
        - email_taken
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 1024 }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 40, maxLength: 512 }
    Session:
      type: object
      # token_type зафиксирован: клиент не должен угадывать схему Authorization.
      required: [access_token, refresh_token, token_type, access_expires_at, refresh_expires_at]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
    DeviceCreate:
      type: object
      required: [public_key, platform, name]
      properties:
        public_key: { type: string, pattern: "^[A-Za-z0-9+/]{43}=$" }
        platform:
          type: string
          enum: [android, ios, windows, macos, linux, other]
        name: { type: string, minLength: 1, maxLength: 64 }
    Device:
      type: object
      required: [id, public_key, platform, name, created_at, last_seen_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        public_key: { type: string, pattern: "^[A-Za-z0-9+/]{43}=$" }
        platform:
          type: string
          enum: [android, ios, windows, macos, linux, other]
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: ["string", "null"], format: date-time }
        revoked_at: { type: ["string", "null"], format: date-time }
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: "#/components/schemas/Device" }
    RotateRequest:
      type: object
      required: [public_key]
      properties:
        public_key: { type: string, pattern: "^[A-Za-z0-9+/]{43}=$" }
    PlanView:
      type: object
      required: [slug, device_limit, traffic_quota_bytes]
      properties:
        slug: { type: string }
        device_limit: { type: integer, minimum: 1 }
        # NULL = без квоты. Именно null, а не 0: ноль читается как «трафик кончился».
        traffic_quota_bytes: { type: ["integer", "null"] }
    Me:
      type: object
      required: [user, plan, devices]
      properties:
        user:
          type: object
          required: [id, email, status, locale, created_at]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: ["string", "null"] }
            status: { type: string, enum: [active, locked, deleted] }
            locale: { type: string }
            created_at: { type: string, format: date-time }
        plan:
          # null — активной подписки нет (истекла или не была выдана). /me описывает
          # состояние аккаунта, а не выдаёт право, поэтому здесь данные, а не отказ:
          # 403 на «подписка кончилась» был бы неправдой про доступ.
          anyOf:
            - $ref: "#/components/schemas/PlanView"
            - type: "null"
        devices:
          type: object
          required: [live, limit]
          properties:
            live: { type: integer, minimum: 0 }
            # 0 — подписки нет, и права на устройства тоже (ср. POST /devices: 403).
            # Минимум не может быть 1, иначе истёкший аккаунт не описывается контрактом.
            limit: { type: integer, minimum: 0 }
    ServerSummary:
      type: object
      description: >
        Сервер каталога. latency_ms и load всегда null: контрол-плейн их не измерял.
        capacity_mbps — заявленная оператором ёмкость, null если не заявлена.
      required:
        - id
        - name
        - country_code
        - city
        - host
        - port
        - mtu
        - latitude
        - longitude
        - availability
        - latency_ms
        - load
        - capacity_mbps
        - provider
        - region
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        city: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        mtu: { type: integer }
        latitude: { type: number }
        longitude: { type: number }
        availability:
          type: string
          enum: [available, unknown]
          description: >
            available — только свежий heartbeat (не старше 90 с) со статусом ok;
            unknown — всё прочее, включая «замера ещё не было».
        latency_ms: { type: ["integer", "null"], description: "null — задержку не измеряли" }
        load: { type: ["number", "null"], description: "null — загрузку не измеряли" }
        capacity_mbps: { type: ["integer", "null"] }
        provider: { type: string }
        region: { type: string, description: "Пустая строка — оператор не заполнил" }
    ServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/ServerSummary" }
    ProfileIssueRequest:
      type: object
      required: [server_id]
      properties:
        server_id: { type: string, format: uuid }
    ProfileView:
      type: object
      required:
        - id
        - device_id
        - server_id
        - address_v4
        - status
        - issued_at
        - expires_at
        - overlap_valid_until
        - revoked_at
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        address_v4: { type: string, format: ipv4 }
        status: { type: string, enum: [active, superseded, revoked, expired] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        overlap_valid_until: { type: ["string", "null"], format: date-time }
        revoked_at: { type: ["string", "null"], format: date-time }
    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/ProfileView" }
    AdminSession:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, minimum: 1 }
    AdminServerView:
      type: object
      required:
        - id
        - name
        - advertised_host
        - listen_port
        - public_key
        - address_pool_v4
        - mtu
        - keepalive_sec
        - config_version
        - maintenance_status
        - provider
        - region
        - capacity_mbps
        - country_code
        - city
        - peers_active
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        advertised_host: { type: string }
        listen_port: { type: integer, minimum: 1, maximum: 65535 }
        public_key: { type: string, pattern: "^[A-Za-z0-9+/]{43}=$" }
        address_pool_v4: { type: string }
        mtu: { type: integer }
        keepalive_sec: { type: integer }
        config_version: { type: integer, format: int64 }
        maintenance_status:
          type: string
          enum: [online, draining, maintenance, retired]
        provider: { type: string }
        region: { type: ["string", "null"] }
        capacity_mbps: { type: ["integer", "null"] }
        country_code: { type: string }
        city: { type: string }
        peers_active: { type: integer, minimum: 0 }
    AdminServerDetail:
      description: >
        Сервер плюс здоровье. health = null означает «замеров ещё не было», а не нули.
      allOf:
        - $ref: "#/components/schemas/AdminServerView"
        - type: object
          required: [health]
          properties:
            health:
              anyOf:
                - $ref: "#/components/schemas/Health"
                - type: "null"
    Health:
      type: object
      required:
        - observed_at
        - peers_configured
        - peers_handshaked
        - interface_rx_bytes
        - interface_tx_bytes
        - load1
        - cpu_pct
        - applied_config_version
        - status
        - agent_version
        - agent_uptime_sec
      properties:
        observed_at: { type: string, format: date-time }
        peers_configured: { type: integer, minimum: 0 }
        peers_handshaked: { type: integer, minimum: 0 }
        interface_rx_bytes: { type: integer, format: int64 }
        interface_tx_bytes: { type: integer, format: int64 }
        load1: { type: ["string", "null"], description: "Строка из numeric; null — не измеряли" }
        cpu_pct: { type: ["string", "null"] }
        applied_config_version: { type: integer, format: int64 }
        status: { type: string, enum: [ok, stale, error] }
        agent_version: { type: ["string", "null"] }
        agent_uptime_sec: { type: ["integer", "null"], format: int64 }
    AdminServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/AdminServerView" }
    AdminServerCreate:
      type: object
      required: [location, name, advertised_host, listen_port, public_key, address_pool_v4]
      properties:
        location:
          type: object
          required: [country_code, city, lat, lon, timezone]
          properties:
            country_code: { type: string, pattern: "^[A-Z]{2}$" }
            city: { type: string, minLength: 1, maxLength: 64 }
            lat: { type: string, pattern: "^-?[0-9]{1,3}(\\.[0-9]{1,6})?$" }
            lon: { type: string, pattern: "^-?[0-9]{1,3}(\\.[0-9]{1,6})?$" }
            timezone: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 64 }
        advertised_host: { type: string, pattern: "^[A-Za-z0-9.\\-]{1,253}$" }
        listen_port: { type: integer, minimum: 1, maximum: 65535 }
        public_key: { type: string, pattern: "^[A-Za-z0-9+/]{43}=$" }
        address_pool_v4: { type: string, description: "Сеть IPv4 с маской от /24 до /29" }
        mtu: { type: integer, minimum: 1280, maximum: 1420, default: 1420 }
        keepalive_sec: { type: integer, minimum: 5, maximum: 120, default: 25 }
        provider: { type: string }
        region: { type: ["string", "null"] }
        capacity_mbps: { type: ["integer", "null"], minimum: 1, maximum: 1000000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminServerPatch:
      type: object
      required: [name, advertised_host, listen_port, mtu, keepalive_sec]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        advertised_host: { type: string, pattern: "^[A-Za-z0-9.\\-]{1,253}$" }
        listen_port: { type: integer, minimum: 1, maximum: 65535 }
        mtu: { type: integer, minimum: 1280, maximum: 1420 }
        keepalive_sec: { type: integer, minimum: 5, maximum: 120 }
        capacity_mbps: { type: ["integer", "null"], minimum: 1, maximum: 1000000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    MaintenanceRequest:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [online, draining, maintenance, retired] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    MaintenanceView:
      type: object
      required: [id, name, maintenance_status, config_version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maintenance_status:
          type: string
          enum: [online, draining, maintenance, retired]
        config_version: { type: integer, format: int64 }
    ReasonRequest:
      type: object
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    BootstrapTokenRequest:
      type: object
      properties:
        ttl_sec: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
    BootstrapToken:
      type: object
      required: [id, server_id, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    BootstrapTokenIssued:
      description: >
        Ответ выдачи: строка токена присутствует только здесь. Список и повторный вызов
        секрет не возвращают — в базе хранится sha256.
      allOf:
        - $ref: "#/components/schemas/BootstrapToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^[A-Za-z0-9_-]{43}$"
    BootstrapTokenList:
      type: object
      required: [bootstrap_tokens]
      properties:
        bootstrap_tokens:
          type: array
          items: { $ref: "#/components/schemas/BootstrapToken" }
    AdminUserView:
      type: object
      required: [id, email, display_name, status, locked_reason, locale, created_at, devices, traffic]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: ["string", "null"] }
        status: { type: string, enum: [active, locked, deleted] }
        locked_reason: { type: ["string", "null"] }
        locale: { type: string }
        created_at: { type: string, format: date-time }
        devices:
          type: array
          items: { $ref: "#/components/schemas/AdminDevice" }
        traffic:
          type: array
          items: { $ref: "#/components/schemas/TrafficEntry" }
    AdminDevice:
      type: object
      required: [id, public_key, platform, name, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        public_key: { type: string }
        platform: { type: string, enum: [android, ios, windows, macos, linux, other] }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: ["string", "null"], format: date-time }
    TrafficEntry:
      type: object
      required: [device_id, rx_bytes, tx_bytes, days]
      properties:
        device_id: { type: string, format: uuid }
        rx_bytes: { type: integer, format: int64 }
        tx_bytes: { type: integer, format: int64 }
        days: { type: integer, minimum: 0 }
    LockRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    LockResult:
      type: object
      required: [id, status, profiles_revoked, servers_bumped]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, locked, deleted] }
        profiles_revoked: { type: integer, minimum: 0 }
        servers_bumped: { type: integer, minimum: 0 }
    AdminCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
    AdminView:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, admin_id, action, target_type, target_id, reason, request_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        admin_id: { type: ["string", "null"], description: "null — действие системы, а не человека" }
        action:
          type: string
          enum:
            - server_created
            - server_updated
            - server_drained
            - server_deleted
            - node_token_revoked
            - node_enrolled
            - user_locked
            - user_unlocked
            - admin_created
            - bootstrap_token_issued
            - bootstrap_token_revoked
        target_type: { type: string }
        target_id: { type: string }
        reason: { type: string }
        request_id: { type: string }
        created_at: { type: string, format: date-time }
    AuditList:
      type: object
      required: [audit]
      properties:
        audit:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
    NodeEnrollRequest:
      type: object
      required: [bootstrap_token, public_key]
      properties:
        bootstrap_token: { type: string }
        public_key: { type: string, pattern: "^[A-Za-z0-9+/]{43}=$" }
    NodeToken:
      type: object
      required: [server_id, node_token]
      properties:
        server_id: { type: string, format: uuid }
        node_token:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 байта в base64url без дополнений; в базе только sha256.
    DesiredSet:
      type: object
      required:
        - server_id
        - config_version
        - mtu
        - listen_port
        - tunnel_address
        - dns_servers
        - keepalive_sec
        - peers
        - measured_at
      properties:
        server_id: { type: string, format: uuid }
        config_version: { type: integer, format: int64 }
        mtu: { type: integer }
        listen_port: { type: integer }
        tunnel_address:
          type: string
          description: "Адрес узла в туннеле с маской пула, например 10.99.7.1/24"
        dns_servers:
          type: array
          items: { type: string }
        keepalive_sec: { type: integer }
        peers:
          type: array
          items: { $ref: "#/components/schemas/DesiredPeer" }
        measured_at: { type: string, format: date-time }
    DesiredPeer:
      type: object
      required: [public_key, allowed_ips, expires_at, state]
      properties:
        public_key: { type: string }
        allowed_ips:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [active, rotating_old_key] }
    ObservedReport:
      type: object
      required: [config_version, interface_rx_bytes, interface_tx_bytes, peers]
      properties:
        config_version: { type: integer, format: int64 }
        interface_rx_bytes: { type: integer, format: int64, maximum: 1125899906842624 }
        interface_tx_bytes: { type: integer, format: int64, maximum: 1125899906842624 }
        peers:
          type: array
          items: { $ref: "#/components/schemas/ObservedPeer" }
    ObservedPeer:
      type: object
      required: [public_key, latest_handshake, rx_bytes, tx_bytes]
      properties:
        public_key: { type: string }
        latest_handshake: { type: ["string", "null"], format: date-time }
        rx_bytes: { type: integer, format: int64, maximum: 1125899906842624 }
        tx_bytes: { type: integer, format: int64, maximum: 1125899906842624 }
    Heartbeat:
      type: object
      required: [agent_version, agent_uptime_sec, load1, cpu_pct, applied_config_version, stale]
      properties:
        agent_version: { type: string }
        agent_uptime_sec: { type: integer, format: int64 }
        load1: { type: ["number", "null"], description: "null — не измеряли" }
        cpu_pct: { type: ["number", "null"], description: "null — не измеряли" }
        applied_config_version: { type: integer, format: int64 }
        stale:
          type: boolean
          description: >
            true — последний desired set не удалось получить дольше интервала опроса;
            узел продолжает обслуживать текущих клиентов на последнем применённом наборе.
