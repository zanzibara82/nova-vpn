# dnsmasq стенда: единственные имена, которые он знает, и никакого внешнего DNS.
# no-resolv обязателен, иначе dnsmasq пошёл бы в resolv.conf контейнера и проверка
# «запрос ушёл через туннель» перестала бы что-либо доказывать.
no-resolv
no-hosts
bind-interfaces
listen-address=0.0.0.0
port=53
address=/probe.e2e.test/172.31.98.3
address=/dns.e2e.test/172.31.98.3