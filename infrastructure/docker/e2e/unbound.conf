# unbound стенда: слушает только туннельную сеть, остальным отказывает.
# log-queries/log-replies выключены: содержимое DNS-запросов не попадает в журнал.
# do-daemonize: yes обязателен для двухпроцессного контейнера — точка входа должна
# дождаться успешного старта демона и только затем exec'нуть агента.
server:
    verbosity: 1
    log-queries: no
    log-replies: no
    use-syslog: no
    interface: 0.0.0.0
    port: 53
    access-control: 10.99.7.0/24 allow
    access-control: 0.0.0.0/0 refuse
    do-ip6: no
    do-daemonize: yes
    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    pidfile: "/run/unbound.pid"
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    minimal-responses: yes

forward-zone:
    name: "."
    forward-addr: 172.31.98.3