# Имя обязательно: без него Compose берёт имя каталога первого файла, то есть «docker».
# `make down-dev` снимает `-v`, а в общем пространстве имён уже есть чужие
# docker-compose.dev.yml (на этом хосте — проект cms) — без имени удалились бы чужие тома.
name: novavpn-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: novavpn
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d novavpn"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    profiles: ["node"]
    image: novavpn-api:dev
    build:
      context: ../..
      dockerfile: Dockerfile.api
    env_file:
      - path: ${NOVAVPN_NODE_DEV_ENV_FILE:-.env.node}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  node-agent:
    profiles: ["node"]
    image: novavpn-node-agent:dev
    build:
      context: ../..
      dockerfile: Dockerfile.node-agent
    depends_on:
      api:
        condition: service_started
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      NOVAVPN_NODE_ENV: dev
      NOVAVPN_NODE_API_URL: http://api:8080
      NOVAVPN_NODE_ALLOW_INSECURE_API: "true"
      NOVAVPN_NODE_STATE_DIR: /var/lib/novavpn-node
    volumes:
      - novavpn-node-state:/var/lib/novavpn-node

volumes:
  novavpn-node-state:
