[defaults]
# Инвентарь по умолчанию — отслеживаемый пример: своего inventory.ini в дереве
# нет. Два предупреждения — «Unable to parse ... inventory.ini» и «No inventory
# was parsed, only implicit localhost is available» — печатал ad-hoc-вызов
# рендера шаблона в цели make unbound-check: он зовёт ansible localhost без
# ключа -i и на пути к файлу, которого нет. Оператор принимал этот шум за
# сломанное развёртывание. Цель make ansible-lint передаёт инвентарь ключом -i
# явно и шума не давала. Реальный хост описывают своим неотслеживаемым файлом
# и передают его тем же ключом.
inventory = inventory.example.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
