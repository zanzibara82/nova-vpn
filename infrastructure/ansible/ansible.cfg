[defaults]
# Инвентарь по умолчанию — отслеживаемый пример. Раньше здесь стоял
# inventory.ini, которого в дереве нет: ad-hoc-вызов рендера шаблона в цели
# make unbound-check читал этот путь из настроек и печатал два предупреждения —
# «Unable to parse ... inventory.ini» и «No inventory was parsed, only implicit
# localhost is available»; оператор принимал этот шум за сломанное развёртывание.
# На отслеживаемом примере предупреждений нет, ключ -i ad-hoc-вызову не нужен.
# Цель make ansible-lint передаёт инвентарь ключом -i явно. Реальный хост
# описывают своим неотслеживаемым файлом и передают его тем же ключом.
inventory = inventory.example.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
