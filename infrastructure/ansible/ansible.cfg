[defaults]
# Инвентарь по умолчанию — отслеживаемый пример: своего inventory.ini в дереве
# нет. Цели, которые зовут playbook без ключа -i (unbound-check и агрегат lint),
# на пути к несуществующему файлу печатали два предупреждения: «Unable to parse
# ... inventory.ini» и «No inventory was parsed, only implicit localhost is
# available». Оператор принимал этот шум за сломанное развёртывание, а вывод
# цели ansible-lint не менялся: она передаёт инвентарь ключом -i явно. Реальный
# хост описывают своим неотслеживаемым файлом и передают его тем же ключом.
inventory = inventory.example.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
